<!doctype html>
<html lang="en" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9d1024" />
    <meta name="description" content="Jaathara Indian Cuisine — a Telangana jathara of pasupu, kumkuma, muggulu and authentic flavours in ECIL, Hyderabad." />
    <title>Jaathara Indian Cuisine | A Feast of Authentic Indian Flavors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html.is-loading, html.is-loading body { overflow: hidden; }
      #preloader {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background:
          radial-gradient(ellipse at 50% 40%, #6b141c 0%, #3e0a12 55%, #24060a 100%);
        transition: opacity 0.7s ease, visibility 0.7s ease;
      }
      #preloader::before {
        content: '';
        position: absolute; inset: 0;
        opacity: 0.12;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='%23E8B42A' stroke-width='0.6'><circle cx='60' cy='60' r='20'/><circle cx='60' cy='60' r='40'/><circle cx='0' cy='0' r='22'/><circle cx='120' cy='0' r='22'/><circle cx='0' cy='120' r='22'/><circle cx='120' cy='120' r='22'/></g></svg>");
        background-size: 160px 160px;
        pointer-events: none;
      }
      #preloader.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      #preloader .pl-inner {
        position: relative; z-index: 1;
        display: flex; flex-direction: column; align-items: center; gap: 14px;
      }
      #preloader .pl-kolam {
        width: min(52vw, 260px); height: min(52vw, 260px);
        color: #f0c75a;
      }
      #preloader .pl-kolam .draw {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.35;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: kolam-draw 1.15s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      #preloader .pl-kolam .draw.d2 { animation-delay: 0.12s; }
      #preloader .pl-kolam .draw.d3 { animation-delay: 0.24s; }
      #preloader .pl-emblem {
        position: absolute;
        top: 50%; left: 50%;
        width: 96px; height: auto;
        transform: translate(-50%, -62%);
        opacity: 0;
        animation: pl-fade 0.7s ease 0.55s forwards;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
      }
      #preloader .pl-name {
        margin: 4px 0 0;
        font-family: 'Rozha One', Georgia, serif;
        font-size: 36px;
        color: #fff8e8;
        letter-spacing: 0.04em;
        opacity: 0;
        animation: pl-fade-plain 0.55s ease 0.4s forwards;
      }
      #preloader .pl-sub {
        margin: -8px 0 0;
        font-family: Cinzel, Times, serif;
        font-size: 9px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #f0c75a;
        opacity: 0;
        animation: pl-fade-plain 0.55s ease 0.55s forwards;
      }
      @keyframes kolam-draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes pl-fade {
        from { opacity: 0; transform: translate(-50%, -50%) scale(0.94); }
        to { opacity: 1; transform: translate(-50%, -62%) scale(1); }
      }
      #preloader .pl-name, #preloader .pl-sub {
        transform: none;
      }
      #preloader .pl-name { animation-name: pl-fade-plain; }
      #preloader .pl-sub { animation-name: pl-fade-plain; }
      @keyframes pl-fade-plain {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader .draw, #preloader .pl-emblem, #preloader .pl-name, #preloader .pl-sub {
          animation: none !important;
          stroke-dashoffset: 0;
          opacity: 1;
          transform: none;
        }
        #preloader .pl-emblem { transform: translate(-50%, -62%); }
      }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-live="polite" aria-label="Loading Jaathara">
      <div class="pl-inner">
        <svg class="pl-kolam" viewBox="0 0 200 200" aria-hidden="true">
          <circle class="draw" pathLength="100" cx="100" cy="100" r="28" />
          <circle class="draw d2" pathLength="100" cx="100" cy="100" r="52" />
          <circle class="draw d3" pathLength="100" cx="100" cy="100" r="78" />
          <path class="draw d2" pathLength="100" d="M100 22 C130 50 130 90 100 118 C70 90 70 50 100 22 Z" />
          <path class="draw d2" pathLength="100" d="M100 22 C130 50 130 90 100 118 C70 90 70 50 100 22 Z" transform="rotate(45 100 100)" />
          <path class="draw d2" pathLength="100" d="M100 22 C130 50 130 90 100 118 C70 90 70 50 100 22 Z" transform="rotate(90 100 100)" />
          <path class="draw d2" pathLength="100" d="M100 22 C130 50 130 90 100 118 C70 90 70 50 100 22 Z" transform="rotate(135 100 100)" />
          <circle class="draw d3" pathLength="100" cx="100" cy="100" r="92" />
          <g fill="#E8B42A" stroke="none">
            <circle cx="100" cy="8" r="2.4" />
            <circle cx="100" cy="192" r="2.4" />
            <circle cx="8" cy="100" r="2.4" />
            <circle cx="192" cy="100" r="2.4" />
            <circle cx="34" cy="34" r="2.1" />
            <circle cx="166" cy="34" r="2.1" />
            <circle cx="34" cy="166" r="2.1" />
            <circle cx="166" cy="166" r="2.1" />
          </g>
        </svg>
        <p class="pl-name">Jaathara</p>
        <p class="pl-sub">Indian Cuisine</p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var min = reduce ? 180 : 1200;
        var max = reduce ? 400 : 4000;
        var t0 = Date.now();
        var finished = false;
        function finish() {
          if (finished) return;
          finished = true;
          var el = document.getElementById('preloader');
          document.documentElement.classList.add('loaded');
          document.documentElement.classList.remove('is-loading');
          if (el) {
            el.classList.add('is-done');
            setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, reduce ? 120 : 750);
          }
        }
        function afterMin() {
          var wait = Math.max(0, min - (Date.now() - t0));
          setTimeout(finish, wait);
        }
        setTimeout(finish, max);
        if (document.readyState === 'complete') afterMin();
        else window.addEventListener('load', afterMin);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
