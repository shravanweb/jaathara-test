<!doctype html>
<html lang="en" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9d1024" />
    <meta name="description" content="Jaathara Indian Cuisine — a Telangana jathara of pasupu, kumkuma, muggulu and authentic flavours in Sandy, Utah." />
    <title>Jaathara Indian Cuisine | A Feast of Authentic Indian Flavors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html.is-loading, html.is-loading body { overflow: hidden; }
      #preloader {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background:
          radial-gradient(ellipse at 50% 42%, #ffffff 0%, #fffaf0 55%, #f7ecd6 100%);
        transition: opacity 0.7s ease, visibility 0.7s ease;
      }
      #preloader::before {
        content: '';
        position: absolute; inset: 0;
        opacity: 0.18;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='%23E8B42A' stroke-width='0.6'><circle cx='60' cy='60' r='20'/><circle cx='60' cy='60' r='40'/><circle cx='0' cy='0' r='22'/><circle cx='120' cy='0' r='22'/><circle cx='0' cy='120' r='22'/><circle cx='120' cy='120' r='22'/></g></svg>");
        background-size: 160px 160px;
        pointer-events: none;
      }
      #preloader.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
      #preloader .pl-inner {
        position: relative; z-index: 1;
        display: flex; flex-direction: column; align-items: center; gap: 14px;
      }
      #preloader .pl-kolam {
        width: min(52vw, 260px); height: min(52vw, 260px);
        color: #f0c75a;
      }
      #preloader .pl-kolam .draw {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.35;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: kolam-draw 1.15s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      #preloader .pl-kolam .draw.d2 { animation-delay: 0.12s; }
      #preloader .pl-kolam .draw.d3 { animation-delay: 0.24s; }
      #preloader .pl-emblem {
        position: absolute;
        top: 50%; left: 50%;
        width: 96px; height: auto;
        transform: translate(-50%, -62%);
        opacity: 0;
        animation: pl-fade 0.7s ease 0.55s forwards;
        filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
      }
      #preloader .pl-name {
        margin: 4px 0 0;
        font-family: 'Poppins', system-ui, sans-serif;
        font-size: 36px;
        color: #fff8e8;
        letter-spacing: 0.04em;
        opacity: 0;
        animation: pl-fade-plain 0.55s ease 0.4s forwards;
      }
      #preloader .pl-sub {
        margin: -8px 0 0;
        font-family: Cinzel, Times, serif;
        font-size: 9px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #f0c75a;
        opacity: 0;
        animation: pl-fade-plain 0.55s ease 0.55s forwards;
      }
      @keyframes kolam-draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes pl-fade {
        from { opacity: 0; transform: translate(-50%, -50%) scale(0.94); }
        to { opacity: 1; transform: translate(-50%, -62%) scale(1); }
      }
      #preloader .pl-name, #preloader .pl-sub {
        transform: none;
      }
      #preloader .pl-name { animation-name: pl-fade-plain; }
      #preloader .pl-sub { animation-name: pl-fade-plain; }
      @keyframes pl-fade-plain {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader .draw, #preloader .pl-emblem, #preloader .pl-name, #preloader .pl-sub {
          animation: none !important;
          stroke-dashoffset: 0;
          opacity: 1;
          transform: none;
        }
        #preloader .pl-emblem { transform: translate(-50%, -62%); }
      }
      #preloader .pl-card {
        position: relative;
        width: min(78vw, 380px);
        padding: 18px 22px;
        background: transparent;
        border-radius: 22px;
        box-shadow: none;
        opacity: 0;
        animation: pl-pop 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.1s forwards;
      }
      #preloader .pl-card::after {
        content: '';
        position: absolute; inset: -14px;
        border: 0;
        border-radius: 30px;
        pointer-events: none;
      }
      #preloader .pl-logo { display: block; width: 100%; height: auto; }
      #preloader .pl-bar {
        width: min(46vw, 180px); height: 2px; margin-top: 18px;
        background: rgba(157,16,36,0.12); border-radius: 2px; overflow: hidden;
      }
      #preloader .pl-bar span {
        display: block; height: 100%; width: 40%;
        background: linear-gradient(90deg, transparent, #9d1024, #e8a317, transparent);
        animation: pl-bar 1.1s ease-in-out infinite;
      }
      #preloader .pl-sub { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-size: 18px; color: #7a1020; letter-spacing: 0.02em; text-transform: none; margin: 0; }
      @keyframes pl-pop {
        from { opacity: 0; transform: scale(0.92) translateY(10px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes pl-bar {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader .pl-card, #preloader .pl-bar span { animation: none !important; opacity: 1; transform: none; }
      }
    #preloader .pl-clip {
        position: absolute;
        width: clamp(150px, 17vw, 240px);
        aspect-ratio: 1 / 1;
        object-fit: contain;
        height: auto;
        opacity: 0;
        pointer-events: none;
        animation: pl-clip-in 0.9s ease 0.15s forwards;
      }
      #preloader .pl-c1 { left: 9%; top: 12%; }
      #preloader .pl-c2 { right: 9%; top: 12%; animation-delay: 0.3s; }
      #preloader .pl-c3 { left: 9%; bottom: 12%; animation-delay: 0.45s; }
      #preloader .pl-c4 { right: 9%; bottom: 12%; animation-delay: 0.6s; }
      #preloader .pl-inner { position: relative; z-index: 2; }
      @keyframes pl-clip-in {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 0.32; transform: none; }
      }
      @media (max-width: 640px) {
        #preloader .pl-clip { width: 96px; }
        #preloader .pl-c1, #preloader .pl-c3 { left: 4%; }
        #preloader .pl-c2, #preloader .pl-c4 { right: 4%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader .pl-clip { animation: none; opacity: 0.32; }
      }
    #preloader::after {
        content: '';
        position: absolute;
        inset: -40px;
        background: url('/cliparts/pattern.webp') 0 0 / 560px auto repeat;
        opacity: 0.1;
        pointer-events: none;
        -webkit-mask-image: radial-gradient(ellipse at 50% 46%, transparent 0 16%, #000 42%);
        mask-image: radial-gradient(ellipse at 50% 46%, transparent 0 16%, #000 42%);
        animation: pl-pattern-drift 30s linear infinite;
      }
      @keyframes pl-pattern-drift { to { background-position: 560px 0; } }
      @media (max-width: 640px) {
        #preloader { overflow: hidden; }
      #preloader::before { display: none; }
      #preloader::after { background-size: 380px auto; opacity: 0.09; }
      }
      @media (prefers-reduced-motion: reduce) { #preloader::after { animation: none; } }
      /* Loader: refined, subtle clipart backdrop */
      #preloader {
        background: radial-gradient(ellipse at 50% 45%, #ffffff 0%, #fffbf3 50%, #f6ead2 100%);
      }
      #preloader::after {
        opacity: 0.14;
        filter: sepia(0.4) saturate(0.85);
        animation: none;
        -webkit-mask-image: radial-gradient(ellipse at 50% 46%, transparent 0 24%, rgba(0,0,0,0.75) 48%, #000 70%);
        mask-image: radial-gradient(ellipse at 50% 46%, transparent 0 24%, rgba(0,0,0,0.75) 48%, #000 70%);
      }
      #preloader .pl-inner::before {
        content: ''; position: absolute; z-index: -1;
        left: 50%; top: 50%; width: 560px; height: 560px; max-width: 120vw; max-height: 120vw;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,251,243,0.7) 45%, transparent 70%);
        pointer-events: none;
      }
      @media (max-width: 640px) { #preloader::after { opacity: 0.12; } }
      /* Loader: smaller, gently moving cliparts */
      #preloader::after {
        inset: 0;
        background-size: 340px auto;
        animation: pl-pattern-move 40s linear infinite;
      }
      @keyframes pl-pattern-move {
        from { background-position: 0 0; }
        to { background-position: 340px 255px; }
      }
      @media (max-width: 640px) { #preloader::after { background-size: 240px auto; animation-name: pl-pattern-move-sm; } }
      @keyframes pl-pattern-move-sm { to { background-position: 240px 180px; } }
      @media (prefers-reduced-motion: reduce) { #preloader::after { animation: none; } }
    </style>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="preloader" role="status" aria-live="polite" aria-label="Loading Jaathara">
      <div class="pl-inner">
        <div class="pl-card">
          <img class="pl-logo" src="/jaathara-emblem.png" alt="Jaathara - Let's celebrate Indian food" width="1024" height="512" />
        </div>
        <div class="pl-bar" aria-hidden="true"><span></span></div>
        <p class="pl-sub">A Feast of Authentic Indian Flavors</p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var min = reduce ? 180 : 1200;
        var max = reduce ? 400 : 4000;
        var t0 = Date.now();
        var finished = false;
        function finish() {
          if (finished) return;
          finished = true;
          var el = document.getElementById('preloader');
          document.documentElement.classList.add('loaded');
          document.documentElement.classList.remove('is-loading');
          if (el) {
            el.classList.add('is-done');
            setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, reduce ? 120 : 750);
          }
        }
        function afterMin() {
          var wait = Math.max(0, min - (Date.now() - t0));
          setTimeout(finish, wait);
        }
        setTimeout(finish, max);
        if (document.readyState === 'complete') afterMin();
        else window.addEventListener('load', afterMin);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
